# Сквозной срез (DECISIONS.md п. 18): портал и PostgreSQL. Перед запуском портал собирают:
#   dotnet publish src/Portal/Portal.csproj -c Release -o publish/portal
#   docker compose up -d --build
# Страница функции — http://localhost:8080/f/numpy.sum
services:
  postgres:
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  portal:
    build:
      context: .
      dockerfile: src/Portal/Dockerfile
    environment:
      ConnectionStrings__DotSaxs: "Host=postgres;Port=5432;Database=dotsaxs;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
