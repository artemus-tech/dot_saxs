# Сборка и тесты (SPEC.md п. 0): предупреждения компилятора = ошибки, все тесты зелёные.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # PostgreSQL для интеграционных тестов DotSaxs.Data (SPEC.md п. 9); образ — тот же, что в env-check.yml.
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Исходники оригиналов на закреплённых коммитах
        run: bash tools/sources/fetch.sh "$RUNNER_TEMP/sources"
      - name: Сборка (предупреждения = ошибки)
        run: dotnet build DotSaxs.slnx -c Release -warnaserror
      - name: Тесты
        env:
          DOTSAXS_SOURCES: ${{ runner.temp }}/sources
          DOTSAXS_DB: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
        run: dotnet test --solution DotSaxs.slnx -c Release --no-build

  # Сквозной срез (DECISIONS.md п. 18): портал и PostgreSQL в docker compose, страница функции — в браузере
  # (Playwright). При запуске портал загружает эталоны в базу, страница показывает их оттуда.
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Сборка портала и тестов страниц (предупреждения = ошибки)
        run: |
          dotnet publish src/Portal/Portal.csproj -c Release -o publish/portal -warnaserror
          dotnet build tests/Portal.Tests/Portal.Tests.csproj -c Release -warnaserror
      - name: Портал и PostgreSQL в docker compose
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::портал не ответил за 2 минуты"
          exit 1
      - name: Браузер для Playwright
        run: pwsh tests/Portal.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Страницы портала в браузере
        env:
          PORTAL_URL: http://localhost:8080
          DOTSAXS_PORTAL_REQUIRED: "true"
        run: dotnet test --project tests/Portal.Tests/Portal.Tests.csproj -c Release --no-build
      - name: Журнал compose
        if: always()
        run: docker compose logs --no-color | tail -n 200
      - name: Остановить compose
        if: always()
        run: docker compose down -v

  # names.csv пересчитывается на закреплённых numpy и scipy и должен совпасть с коммитом (tools/names/README.md).
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Эталонный образ с закреплёнными numpy и scipy
        run: |
          pin() { jq -r ".$1.version" sources.json; }
          docker build -q -t dot-saxs-reference --build-arg NUMPY_VERSION="$(pin numpy)" \
            --build-arg SCIPY_VERSION="$(pin scipy)" --build-arg OPENBLAS_VERSION="$(pin openblas)" reference > /dev/null
      - name: names.csv совпадает с генератором
        run: |
          out="$RUNNER_TEMP/names"; mkdir -p "$out"
          docker run --rm -v "$PWD:/repo:ro" -v "$out:/out" dot-saxs-reference python -I /repo/tools/names/generate.py /repo /out
          status=0
          for pair in "names.csv names.csv" "tools/names/tokens.csv tokens.csv"; do
            set -- $pair
            if ! cmp -s "$1" "$out/$2"; then
              status=1
              echo "::error file=$1::$1 отличается от пересчитанного на закреплённых numpy и scipy"
              diff -u "$1" "$out/$2" | head -n 300 || true
              echo "=== НАЧАЛО $2"; cat "$out/$2"; echo "=== КОНЕЦ $2"
            fi
          done
          exit $status

  # Эталоны пересчитываются в эталонном контейнере и должны совпасть с коммитом (tools/reference/README.md).
  # Если разошлись, новые и изменённые файлы — в логе (tar.gz в base64 между метками) и в артефакте references.
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Эталонный образ с закреплёнными numpy и scipy
        run: |
          pin() { jq -r ".$1.version" sources.json; }
          docker build -q -t dot-saxs-reference --build-arg NUMPY_VERSION="$(pin numpy)" \
            --build-arg SCIPY_VERSION="$(pin scipy)" --build-arg OPENBLAS_VERSION="$(pin openblas)" reference > /dev/null
      - name: Эталоны совпадают с генератором
        id: compare
        run: |
          out="$RUNNER_TEMP/references"; mkdir -p "$out"
          docker run --rm -v "$PWD:/repo:ro" -v "$out:/out" dot-saxs-reference python -I /repo/tools/reference/generate.py /repo /out
          if ! diff -r -q tests/references "$out"; then
            echo "::error::tests/references отличается от пересчитанного на закреплённых numpy и scipy; новые эталоны — в артефакте references и в логе"
            diff -r -u --exclude='*.npy' tests/references "$out" | head -n 300 || true
            changed=$(cd "$out" && find . -type f | LC_ALL=C sort | while read -r f; do cmp -s "$f" "$GITHUB_WORKSPACE/tests/references/$f" 2>/dev/null || echo "$f"; done)
            echo "=== НАЧАЛО references.tar.gz: новые и изменённые файлы, base64"
            (cd "$out" && tar czf - $changed) | base64 -w0; echo
            echo "=== КОНЕЦ references.tar.gz"
            exit 1
          fi
      - name: Новые эталоны в артефакт
        if: failure() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: references
          path: ${{ runner.temp }}/references
          retention-days: 7

  # Миграции базы соответствуют модели EF Core (src/Data/README.md). Если нет — CI создаёт миграцию
  # и печатает каталог Migrations в лог (tar.gz в base64 между метками).
  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Миграции соответствуют модели
        run: |
          dotnet tool restore
          project=src/Data/Data.csproj
          dotnet restore "$project"
          if [ -d src/Data/Migrations ] && dotnet ef migrations has-pending-model-changes --project "$project"; then
            exit 0
          fi
          name=$([ -d src/Data/Migrations ] && echo "Change${GITHUB_SHA::7}" || echo Initial)
          dotnet ef migrations add "$name" --project "$project" --output-dir Migrations
          echo "::error::модель базы изменилась без миграции; новая миграция $name — в логе"
          echo "=== НАЧАЛО migrations.tar.gz: каталог src/Data/Migrations, base64"
          tar czf - -C src/Data Migrations | base64 -w0; echo
          echo "=== КОНЕЦ migrations.tar.gz"
          exit 1
